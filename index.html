<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur Vidéo Hybride</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0f172a;
        }

        .btn-video {
            padding: 18px 36px;
            font-size: 20px;
            font-weight: bold;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Modale pour PC uniquement */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
        }

        .modal-content {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 35px;
            cursor: pointer;
            z-index: 10000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <button class="btn-video" onclick="gererLecture()">Regarder la vidéo</button>

    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <iframe id="videoIframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const modal = document.getElementById("videoModal");
        const iframe = document.getElementById("videoIframe");
        const videoSrc = "https://playmogo.com/e/qfli992danv5";

        function gererLecture() {
            // Détection des mobiles, tablettes et Smart TV
            const estRestriction = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|SmartTV|Tizen|WebOS/i.test(navigator.userAgent);

            if (estRestriction) {
                // Sur Téléphone et TV : On ouvre directement le lien pour garantir que la flèche s'affiche
                window.location.href = videoSrc;
            } else {
                // Sur PC : On ouvre la modale classique
                modal.style.display = "block";
                iframe.src = videoSrc;
            }
        }

        function closeModal() {
            modal.style.display = "none";
            iframe.src = "";
        }
    </script>

</body>
</html>
