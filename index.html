<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur Vidéo Modale</title>
    <style>
        /* Styles de base */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }

        /* Style du bouton */
        .btn-video {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-video:hover {
            background-color: #0056b3;
        }

        /* Modale plein écran pour mobile et TV */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
        }

        /* Conteneur qui prend 100% de la modale */
        .modal-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Bouton pour fermer adapté aux TV et Mobiles (gros et bien visible) */
        .close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10000;
            background-color: rgba(0, 0, 0, 0.5);
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            user-select: none;
        }

        /* Remplissage total de l'écran */
        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <button class="btn-video" onclick="openModal()">Regarder</button>

    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div class="video-container">
                <iframe id="videoIframe" src="" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById("videoModal");
        const iframe = document.getElementById("videoIframe");
        // Lien de la vidéo
        const videoSrc = "https://playmogo.com/e/qfli992danv5";

        function openModal() {
            modal.style.display = "block";
            iframe.src = videoSrc;
            
            // Force le focus sur l'iframe pour que la télécommande de la TV fonctionne immédiatement dessus
            setTimeout(() => {
                iframe.focus();
            }, 300);
        }

        function closeModal() {
            modal.style.display = "none";
            iframe.src = ""; // Arrête la vidéo et libère la mémoire
        }

        // Sur TV et Mobile, on évite la fermeture par clic n'importe où pour ne pas bloquer le bouton Play d'origine
    </script>

</body>
</html>
