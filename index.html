<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lecteur Vidéo Modale</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0f172a;
            overflow: hidden;
        }

        /* Bouton d'ouverture */
        .btn-video {
            padding: 18px 36px;
            font-size: 20px;
            font-weight: bold;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-video:hover {
            background-color: #0056b3;
        }

        /* Modale Plein Écran */
        .modal {
            display: none;
            position: fixed;
            z-index: 99999;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
        }

        .modal-content {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Bouton Fermer */
        .close {
            position: absolute;
            top: 25px;
            right: 25px;
            color: #ffffff;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            z-index: 100002; /* Toujours au-dessus de tout */
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.3);
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            user-select: none;
        }

        /* Conteneur Vidéo */
        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }

        /* Notre flèche personnalisée (en arrière-plan) */
        .fake-play-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100000; /* Derrière l'iframe au début */
            background-color: #000000;
        }

        .play-button-icon {
            width: 90px;
            height: 90px;
            background-color: #007bff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(0, 123, 255, 0.6);
        }

        .play-button-icon::after {
            content: "";
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 20px 0 20px 35px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 8px;
        }

        /* L'iframe recouvre TRÈS EXACTEMENT la flèche mais reste invisible (0.001) */
        /* pour intercepter le premier vrai clic obligatoire exigé par la TV ou le Mobile */
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            border: 0 !important;
            display: block;
            z-index: 100001; /* Devant notre flèche */
            opacity: 0.001; 
            transition: opacity 0.15s ease-in-out;
        }

        /* Classe active injectée en JS dès que le premier clic a eu lieu */
        .video-container iframe.activated {
            opacity: 1 !important;
        }
    </style>
</head>
<body>

    <button class="btn-video" onclick="openModal()">Regarder la vidéo</button>

    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            
            <div class="video-container" id="videoBox">
                <div class="fake-play-backdrop">
                    <div class="play-button-icon"></div>
                </div>

                <iframe 
                    id="videoIframe" 
                    src="" 
                    scrolling="no" 
                    frameborder="0" 
                    allowfullscreen="true"
                    allow="autoplay; fullscreen; encrypted-media">
                </iframe>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById("videoModal");
        const iframe = document.getElementById("videoIframe");
        const videoBox = document.getElementById("videoBox");
        
        const videoSrc = "https://playmogo.com/e/qfli992danv5";

        function openModal() {
            modal.style.display = "block";
            // On s'assure que l'iframe démarre en mode invisible
            iframe.classList.remove("activated");
            iframe.src = videoSrc;
            
            setTimeout(() => {
                iframe.focus();
            }, 300);
        }

        // Écouteur global sur le conteneur : dès que l'utilisateur clique (et touche donc le lecteur caché)
        // on passe instantanément l'iframe à 100% d'opacité.
        videoBox.addEventListener("click", function() {
            if (!iframe.classList.contains("activated")) {
                iframe.classList.add("activated");
            }
        });

        // Version pour les écrans tactiles mobiles
        videoBox.addEventListener("touchend", function() {
            if (!iframe.classList.contains("activated")) {
                iframe.classList.add("activated");
            }
        });

        function closeModal() {
            modal.style.display = "none";
            iframe.src = ""; 
            iframe.classList.remove("activated");
        }
    </script>

</body>
</html>
