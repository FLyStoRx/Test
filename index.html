<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur Vidéo Modale</title>
    <style>
        /* Styles de base */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }

        /* Style du bouton */
        .btn-video {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-video:hover {
            background-color: #0056b3;
        }

        /* Modale plein écran */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
        }

        .modal-content {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Bouton Fermer */
        .close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10000;
            background-color: rgba(0, 0, 0, 0.6);
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            user-select: none;
        }

        /* Conteneur plein écran pour l'iframe */
        .video-container {
            width: 100%;
            height: 100%;
            background: #000;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
    </style>
</head>
<body>

    <button class="btn-video" onclick="openModal()">Regarder</button>

    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div class="video-container">
                <iframe 
                    id="videoIframe" 
                    src="" 
                    allow="autoplay; fullscreen; encrypted-media" 
                    sandbox="allow-scripts opacity allow-same-origin allow-forms allow-presentation"
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById("videoModal");
        const iframe = document.getElementById("videoIframe");
        const videoSrc = "https://playmogo.com/e/qfli992danv5";

        function openModal() {
            // Détection si l'utilisateur est sur une Smart TV ou un environnement mobile très restreint
            const isTVOrMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|SmartTV|Macintosh/i.test(navigator.userAgent);

            // Sur certaines TV/mobiles, l'iframe externe est totalement bloquée par le constructeur.
            // On utilise alors le Fallback : ouverture directe du flux pour garantir que la flèche apparaisse.
            if (isTVOrMobile && window.innerWidth < 1024) { 
                const newWindow = window.open(videoSrc, '_blank');
                if (newWindow) return; // Si la fenêtre s'ouvre, on stoppe la modale parente
            }

            // Sinon, ouverture classique dans la modale plein écran optimisée
            modal.style.display = "block";
            iframe.src = videoSrc;
            
            setTimeout(() => {
                iframe.focus();
            }, 400);
        }

        function closeModal() {
            modal.style.display = "none";
            iframe.src = ""; 
        }
    </script>

</body>
</html>
