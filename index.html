<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lecteur Vidéo Modale</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0f172a;
            overflow: hidden;
        }

        /* Bouton d'ouverture */
        .btn-video {
            padding: 18px 36px;
            font-size: 20px;
            font-weight: bold;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-video:hover {
            background-color: #0056b3;
        }

        /* Modale Plein Écran */
        .modal {
            display: none;
            position: fixed;
            z-index: 99999;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
        }

        .modal-content {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Bouton Fermer */
        .close {
            position: absolute;
            top: 25px;
            right: 25px;
            color: #ffffff;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            z-index: 100001;
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.3);
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            user-select: none;
        }

        /* Conteneur Vidéo */
        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            border: 0 !important;
            display: block;
        }

        /* LA GRANDE FLÈCHE FORCÉE (Invisible au début, apparaît sur TV/Mobile si besoin) */
        .fake-play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100000; /* Placé juste au-dessus de l'iframe pour capter le clic */
            cursor: pointer;
        }

        /* Triangle de la flèche de lecture */
        .play-button-icon {
            width: 90px;
            height: 90px;
            background-color: rgba(0, 123, 255, 0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(0, 123, 255, 0.5);
            transition: transform 0.2s;
        }

        .play-button-icon::after {
            content: "";
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 20px 0 20px 35px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 8px; /* Centre visuellement le triangle */
        }

        .fake-play-overlay:hover .play-button-icon {
            transform: scale(1.1);
            background-color: #007bff;
        }
    </style>
</head>
<body>

    <button class="btn-video" onclick="openModal()">Regarder la vidéo</button>

    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            
            <div class="video-container">
                <div id="fakePlay" class="fake-play-overlay" onclick="startVideo()">
                    <div class="play-button-icon"></div>
                </div>

                <iframe 
                    id="videoIframe" 
                    src="" 
                    scrolling="no" 
                    frameborder="0" 
                    allowfullscreen="true"
                    allow="autoplay; fullscreen; encrypted-media">
                </iframe>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById("videoModal");
        const iframe = document.getElementById("videoIframe");
        const fakePlay = document.getElementById("fakePlay");
        
        const videoSrc = "https://playmogo.com/e/qfli992danv5";

        function openModal() {
            modal.style.display = "block";
            fakePlay.style.display = "flex"; // On affiche notre flèche personnalisée
            iframe.src = videoSrc;
            
            setTimeout(() => {
                iframe.focus();
            }, 300);
        }

        function startVideo() {
            // Au clic sur notre flèche, on la cache instantanément pour laisser place au lecteur
            fakePlay.style.display = "none";
            
            // On renvoie un signal d'autoplay pour forcer le démarrage sur le navigateur TV/Mobile
            if (!iframe.src.includes('autoplay=1')) {
                iframe.src = videoSrc + "?autoplay=1";
            }
        }

        function closeModal() {
            modal.style.display = "none";
            iframe.src = ""; 
        }
    </script>

</body>
</html>
