<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur Vidéo Standard Modale</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0f172a;
        }

        .btn-video {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Modale Plein Écran */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
        }

        .modal-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            z-index: 10000;
            background: rgba(0,0,0,0.5);
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
        }

        /* Lecteur vidéo HTML5 natif */
        video {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <button class="btn-video" onclick="openModal()">Regarder la vidéo</button>

    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <video id="monLecteur" controls playsinline>
                <source src="URL_DE_VOTRE_VIDEO.mp4" type="video/mp4">
                Votre navigateur ne supporte pas la lecture de vidéos.
            </video>
        </div>
    </div>

    <script>
        const modal = document.getElementById("videoModal");
        const video = document.getElementById("monLecteur");

        function openModal() {
            modal.style.display = "block";
            video.load(); // Recharge la vidéo proprement
            video.play().catch(error => {
                console.log("Lecture automatique bloquée, l'utilisateur doit cliquer sur Play.");
            });
        }

        function closeModal() {
            modal.style.display = "none";
            video.pause(); // Coupe le son et met en pause
            video.currentTime = 0; // Remet à zéro
        }
    </script>

</body>
</html>
