<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lecteur Vidéo Modale</title>
    <style>
        /* Styles de la page d'accueil */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            font-family: Arial, sans-serif;
        }

        .container-principal {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .btn-video {
            padding: 18px 36px;
            font-size: 20px;
            font-weight: bold;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-video:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        /* Styles du mode lecteur plein écran absolu */
        .fullscreen-player-mode {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 999999;
        }

        .fullscreen-player-mode iframe {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
            display: block;
        }

        /* Bouton retour personnalisé pour revenir au site */
        .btn-retour-site {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000000;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.4);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        .btn-retour-site:hover {
            background-color: #dc3545;
            border-color: #dc3545;
        }
    </style>
</head>
<body>

    <div id="contenuSite" class="container-principal">
        <button class="btn-video" onclick="lancerVideoPleinEcran()">Regarder la vidéo</button>
    </div>

    <script>
        // Sauvegarde de l'état initial du site pour pouvoir y revenir
        const htmlInitial du Site = document.getElementById("contenuSite").innerHTML;
        const urlVideo = "https://playmogo.com/e/qfli992danv5";

        function lancerVideoPleinEcran() {
            // 1. On crée un bloc de lecture brut et isolé
            const conteneurLecteur = document.createElement('div');
            conteneurLecteur.id = "lecteurForce";
            conteneurLecteur.className = "fullscreen-player-mode";

            // 2. On y injecte le bouton de sortie et l'iframe la plus basique possible
            // L'absence de styles CSS complexes empêche l'hébergeur de détecter un blocage
            conteneurLecteur.innerHTML = `
                <button class="btn-retour-site" onclick="quitterLecteur()">&times;</button>
                <iframe 
                    src="${urlVideo}" 
                    allowfullscreen="true" 
                    webkitallowfullscreen="true" 
                    mozallowfullscreen="true"
                    allow="autoplay; fullscreen">
                </iframe>
            `;

            // 3. On vide le site et on injecte le lecteur directement à la racine du body
            document.body.innerHTML = "";
            document.body.appendChild(conteneurLecteur);

            // Donner le focus immédiat pour les Smart TV
            setTimeout(() => {
                const iframe = conteneurLecteur.querySelector('iframe');
                if(iframe) iframe.focus();
            }, 200);
        }

        function quitterLecteur() {
            // Fonction pour restaurer le site à son état d'origine
            document.body.innerHTML = `<div id="contenuSite" class="container-principal">${htmlInitial du Site}</div>`;
        }
    </script>

</body>
</html>
